openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: Website application submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a website application
      description: Sends an application form submission to the broker inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationSubmission"
      responses:
        "200":
          description: Application email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmissionResponse"
        "400":
          description: Invalid application data
        "502":
          description: Email delivery failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApplicationSubmission:
      type: object
      properties:
        formType:
          type: string
          enum: [quick, detailed]
        name:
          type: string
        phone:
          type: string
        company:
          type: string
        email:
          type: string
        amount:
          type: string
        description:
          type: string
      required:
        - formType
        - name
        - phone
        - company
    ApplicationSubmissionResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

